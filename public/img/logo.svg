<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Mona Airways">
  <!--
    An M drawn as one continuous path, split at its valley into two strokes:
    the outbound leg saturated, the return leg quieter. The monogram and the
    itinerary are the same shape.

    Square on purpose. The old asset was 344x127 asked for at 20x20 and 32x32,
    so it painted as a 7px-tall sliver; this fills the box it is given. Both
    call sites name the airline in text beside it, so the mark carries no
    wordmark of its own.

    The return leg differs by saturation rather than by lightness. Dimming it
    inverted the hierarchy depending on the ground — a paler stroke is the
    weaker one on black and the stronger one on white — so the quiet leg is a
    desaturated purple of similar lightness instead. Colour, not brightness,
    is what survives the change of background.

    Tuned for dark grounds: the near-black header and the indigo boarding pass.
    On white both strokes read, but the contrast between them flattens.
  -->
  <defs>
    <linearGradient id="mona-out" x1="4" y1="27" x2="17" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="mona-back" x1="16" y1="5" x2="28" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b8fb8"/>
      <stop offset="1" stop-color="#8578a5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21.5 21.6 5.6 28 26.6" stroke="url(#mona-back)"/>
    <path d="M4 26.6 10.4 5.6 16 21.5" stroke="url(#mona-out)"/>
  </g>
</svg>
