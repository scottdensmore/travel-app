services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travel_app
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      # The bundled proxy below is the single trusted right-most proxy.
      AUTH_TRUSTED_PROXY_HOPS: "1"
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Mona Airways <no-reply@localhost>}"
      AUTH_EMAIL_PROVIDER: mailpit
      AUTH_EMAIL_API_URL: http://mailpit:8025/api/v1/send
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travel_app
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d travel_app" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
