services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travel_app
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      PASSENGER_DATA_ENCRYPTION_KEYS: ${PASSENGER_DATA_ENCRYPTION_KEYS:?PASSENGER_DATA_ENCRYPTION_KEYS is required}
      STAFF_MFA_ENCRYPTION_KEYS: ${STAFF_MFA_ENCRYPTION_KEYS:?STAFF_MFA_ENCRYPTION_KEYS is required}
      # The bundled proxy below is the single trusted right-most proxy.
      AUTH_TRUSTED_PROXY_HOPS: "1"
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Mona Airways <no-reply@localhost>}"
      AUTH_EMAIL_PROVIDER: mailpit
      AUTH_EMAIL_API_URL: http://mailpit:8025/api/v1/send
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travel_app
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

  # Keeps inventory ahead of demand so that searching stays read-only (#71).
  # Generation is idempotent, so a missed or repeated run needs no recovery and
  # a restart simply resumes. Deployments that do not use Compose must run
  # `npm run inventory:generate` on their own schedule.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travel_app
      INVENTORY_HORIZON_DAYS: "${INVENTORY_HORIZON_DAYS:-366}"
      INVENTORY_INTERVAL_SECONDS: "${INVENTORY_INTERVAL_SECONDS:-21600}"
    command: >
      sh -c 'while true; do
        npm run inventory:generate --silent || echo "inventory generation failed" >&2;
        sleep "$$INVENTORY_INTERVAL_SECONDS";
      done'
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d travel_app" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
